[project]
name = "euskotren-timetable"
version = "0.1.0"
description = "Build a single Excel timetable from the official Euskotren PDFs"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
euskotren-timetable = "euskotren_timetable.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["euskotren_timetable*"]
