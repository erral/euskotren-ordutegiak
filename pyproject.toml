[project]
name = "euskotren-timetable"
version = "0.1.0"
description = "Build a single Excel timetable from the official Euskotren PDFs"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["ruff==0.15.22"]

[project.scripts]
euskotren-timetable = "euskotren_timetable.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["euskotren_timetable*"]

[tool.setuptools.package-data]
euskotren_timetable = ["templates/*.html", "assets/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".scratch", "data", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long poster notes and workbook strings intentionally exceed the line length.
ignore = ["E501"]
