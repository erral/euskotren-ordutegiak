name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff format --check .
          ruff check .

      - name: Download timetable PDFs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import requests

          manifest = json.loads(Path("data/manifest.json").read_text())
          headers = {"User-Agent": "Mozilla/5.0 (compatible; euskotren-timetable CI)"}
          for entry in manifest["files"]:
              target = Path(entry["path"])
              target.parent.mkdir(parents=True, exist_ok=True)
              response = requests.get(entry["url"], timeout=60, headers=headers)
              response.raise_for_status()
              target.write_bytes(response.content)
              print(f"downloaded {target}")
          PY

      - name: Download GTFS
        run: |
          python - <<'PY'
          from pathlib import Path

          import requests

          url = "https://opendata.euskadi.eus/transport/moveuskadi/euskotren/gtfs_euskotren.zip"
          target = Path("data/gtfs/gtfs_euskotren.zip")
          target.parent.mkdir(parents=True, exist_ok=True)
          response = requests.get(
              url,
              timeout=120,
              headers={"User-Agent": "Mozilla/5.0 (compatible; euskotren-timetable CI)"},
          )
          response.raise_for_status()
          target.write_bytes(response.content)
          print(f"downloaded {target}")
          PY

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build PDF site
        run: |
          python -m euskotren_timetable.cli build-html \
            --source pdf \
            --output output/site \
            --compare \
            --gtfs-url gtfs/index.html \
            --workbook-name euskotren_timetables_winter_2026_pdf.xlsx

      - name: Build GTFS site
        run: |
          python -m euskotren_timetable.cli build-html \
            --source gtfs \
            --gtfs data/gtfs/gtfs_euskotren.zip \
            --output output/site/gtfs \
            --workbook output/euskotren_timetables_winter_2026_gtfs.xlsx \
            --workbook-name euskotren_timetables_winter_2026_gtfs.xlsx \
            --pdf-url ../index.html \
            --compare-url ../compare.html

      - name: Validate composed site
        run: python -m euskotren_timetable.cli validate-site --output output/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
